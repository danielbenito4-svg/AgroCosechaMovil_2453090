name: Validar proyecto y preparar evidencias

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generar .gitignore oficial de .NET
        run: dotnet new gitignore --force

      - name: Compilar proyecto
        run: dotnet build

      - name: Iniciar aplicacion
        run: |
          dotnet run --urls "http://127.0.0.1:5090" > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5090/api/insumos > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generar capturas 01 02 03 y 05
        run: node scripts/generar-capturas.mjs

      - name: Verificar medidas de capturas
        run: |
          python - <<'PY'
          import struct

          def width(path):
              with open(path, "rb") as f:
                  sig = f.read(24)
              if sig[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path} no es PNG")
              return struct.unpack(">I", sig[16:20])[0]

          expected = {
              "capturas/01_movil_catalogo.png": 375,
              "capturas/02_movil_cotizacion.png": 375,
              "capturas/03_escritorio.png": 1100,
          }

          for path, wanted in expected.items():
              got = width(path)
              print(f"{path}: {got}px")
              if got != wanted:
                  raise SystemExit(f"Ancho incorrecto en {path}: {got}px, se esperaba {wanted}px")
          PY

      - name: Limpiar archivos temporales
        run: |
          rm -f capturas/git-log.html
          rm -f app.log app.pid

      - name: Guardar correcciones en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore capturas/01_movil_catalogo.png capturas/02_movil_cotizacion.png capturas/03_escritorio.png capturas/05_git_log.png
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Ajusta gitignore oficial y evidencias a medidas requeridas"
            git pull --rebase origin main
            git push
          fi

      - name: Preparar ZIP provisional
        run: |
          rm -rf /tmp/AgroCosechaMovil_2453090
          mkdir -p /tmp/AgroCosechaMovil_2453090
          rsync -a             --exclude 'bin/'             --exclude 'obj/'             --exclude 'node_modules/'             --exclude '*.zip'             --exclude 'app.log'             --exclude 'app.pid'             ./ /tmp/AgroCosechaMovil_2453090/
          cd /tmp
          zip -r AgroCosechaMovil_2453090.zip AgroCosechaMovil_2453090

      - name: Publicar ZIP provisional
        uses: actions/upload-artifact@v4
        with:
          name: AgroCosechaMovil_2453090
          path: /tmp/AgroCosechaMovil_2453090.zip
          if-no-files-found: error
